apiVersion: v1
kind: Secret
metadata:
  name: medibot-secrets
  namespace: medibot
type: Opaque
stringData:
  # Add your secrets here
  # These should be injected via CI/CD or external secrets manager
  DATABASE_PASSWORD: "changeme_in_production"
  API_SECRET_KEY: "changeme_in_production"
  
  # For PostgreSQL (if using)
  # POSTGRES_USER: "medibot"
  # POSTGRES_PASSWORD: "secure_password_here"
  # POSTGRES_DB: "medibot_db"
