apiVersion: v1
kind: Service
metadata:
  name: medibot-service
  namespace: medibot
  labels:
    app: medibot
    component: backend
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: medibot
    component: backend
---
apiVersion: v1
kind: Service
metadata:
  name: ollama-service
  namespace: medibot
  labels:
    app: ollama
    component: llm
spec:
  type: ClusterIP
  ports:
  - port: 11434
    targetPort: 11434
    protocol: TCP
    name: http
  selector:
    app: ollama
    component: llm
