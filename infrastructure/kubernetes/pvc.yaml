apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: medibot-data-pvc
  namespace: medibot
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  # Uncomment and adjust for your storage class
  # storageClassName: standard
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-data-pvc
  namespace: medibot
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  # Ollama models can be large
  # storageClassName: standard
